services:
  - type: web
    name: multica-backend
    runtime: image
    image:
      url: ghcr.io/multica-ai/multica-backend:v0.5.1
    plan: free
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multica-db
          property: connectionString
      - key: PORT
        value: "8080"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: development
      - key: LOG_LEVEL
        value: info
      - key: ALLOW_SIGNUP
        value: "true"
      - key: HTTP_CLIENT_TIMEOUT
        value: 30s
      - key: MULTICA_DAEMON_POLL_INTERVAL
        value: 5s
      - key: MULTICA_DAEMON_HEARTBEAT_INTERVAL
        value: 15s
      - key: MULTICA_DAEMON_MAX_CONCURRENT_TASKS
        value: "5"
      - key: RESEND_API_KEY
        value: ""
      - key: RESEND_FROM_EMAIL
        value: ""
      - key: FRONTEND_ORIGIN
        value: ""
      - key: MULTICA_PUBLIC_URL
        value: ""
      - key: MULTICA_APP_URL
        value: ""
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      - key: GOOGLE_REDIRECT_URI
        value: ""
  - type: web
    name: multica-web
    runtime: image
    image:
      url: ghcr.io/multica-ai/multica-web:v0.5.1
    plan: free
    region: oregon
    autoDeploy: false
    envVars:
      - key: REMOTE_API_URL
        value: https://multica-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://multica-backend.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://multica-backend.onrender.com/ws
      - key: HOSTNAME
        value: "0.0.0.0"
databases:
  - name: multica-db
    plan: free
    region: oregon
    databaseName: multica
    user: multica
    postgresMajorVersion: "17"
